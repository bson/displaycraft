# Builds the KDE Plasma (Wayland) AppImage.
#
# - "Run workflow" on the Actions tab: a test build, kept as a downloadable
#   artifact for two weeks.
# - Pushing a version tag (git tag v0.1.0 && git push origin v0.1.0): a
#   public release with the AppImage attached. The tag must match the
#   version in Cargo.toml.
#
# Other platforms' builds will be further jobs here, attaching their files
# to the same release.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    env:
      CACHE: ${{ github.workspace }}/../cache
      OUT: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      # Crates, build output and appimagetool; Rust itself is on the runner
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../cache
          key: appimage-${{ hashFiles('Cargo.lock') }}
          restore-keys: appimage-

      - name: Build the AppImage
        run: packaging/appimage/make-appimage.sh

      - name: Keep the test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: DisplayCraft-AppImage
          path: dist/*.AppImage
          retention-days: 14

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.AppImage \
            --title "DisplayCraft ${GITHUB_REF_NAME#v}" --generate-notes

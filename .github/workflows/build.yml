# Builds the Linux AppImage, the macOS app and the Windows zip.
#
# - "Run workflow" on the Actions tab: test builds, kept as downloadable
#   artifacts for two weeks.
# - Pushing a version tag (git tag v0.1.0 && git push origin v0.1.0): the
#   same, then a public release with every platform's build attached. The
#   tag must match the version in Cargo.toml.
# - A release can instead be made from a test build's files once they've
#   been tried (see SUMMARY.md, Releases); creating it pushes the tag, and
#   the tag's build then leaves that release as it is.
#
# Each platform is a job uploading its build; the release job collects
# them, so a release only appears when all of them built.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      # Crates, build output and appimagetool; Rust itself is on the runner
      - uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/../cache
          key: appimage-${{ hashFiles('Cargo.lock') }}
          restore-keys: appimage-

      # The tag is passed only for a tag build, which must match Cargo.toml
      - name: Build the AppImage
        run: >
          packaging/appimage/make-appimage.sh --cache "${{ github.workspace }}/../cache"
          --out dist --release-tag "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      # Uploaded as it is rather than zipped; the artifact takes the file's
      # name
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.AppImage
          archive: false
          retention-days: 14

  # Apple Silicon only for now
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      # jam and Rust's build output
      - uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/../cache
          key: macos-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-

      - name: Build the app
        run: >
          packaging/macos/make-app.sh --cache "${{ github.workspace }}/../cache"
          --out dist --release-tag "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      # The disk image as it is, rather than zipped
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.dmg
          archive: false
          retention-days: 14

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      # MinGW-w64, jam, Inno Setup and Rust's build output; rustup is on the
      # runner
      - uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}\..\cache
          key: windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-

      - name: Build the zip and installer
        shell: pwsh
        run: >
          packaging/windows/make-app.ps1 -Cache "${{ github.workspace }}\..\cache"
          -Out dist -ReleaseTag "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      # One file per upload when not zipped
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*-setup.exe
          archive: false
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, macos, windows]
    runs-on: ubuntu-24.04
    # Setting permissions drops the rest; listing and fetching this run's
    # artifacts needs actions
    permissions:
      contents: write
      actions: read
    steps:
      # A release already made from tested files is kept: these are a new
      # build of the same commit, not the files that were tried.
      # The files are fetched through the API rather than with
      # download-artifact, which unpacks the Windows zip (stored as it is)
      # into a folder that can't be uploaded; gh run download fails on
      # unzipped artifacts altogether.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it as it is"
            exit 0
          fi
          set -o pipefail
          mkdir dist
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            -q '.artifacts[] | "\(.id) \(.digest) \(.name)"' |
          while read -r id digest name; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "dist/$name"
            echo "${digest#sha256:}  dist/$name" | sha256sum -c
          done
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "DisplayCraft ${GITHUB_REF_NAME#v}" --generate-notes
